<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Imprimir">
<title>Mikra Imprimir</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
<style>
    :root {
        --bg: #0f1a30; --bg-card: #1a2744; --bg-input: #243354; --border: #34466e;
        --text: #eef2fb; --text-2: #9fb0d0; --primary: #4facfe; --success: #34d399;
        --warning: #fbbf24; --danger: #f87171;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
    button { font-family: inherit; }

    .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
    .top h1 { margin: 0; font-size: 1.05em; color: var(--primary); white-space: nowrap; }
    .estado { flex: 1; min-width: 0; font-size: 0.72em; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
    .estado b { font-weight: 700; }

    .wrap { max-width: 520px; margin: 0 auto; padding: 12px 16px 0; }

    /* Destino */
    .dest { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .dest button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; padding: 10px 4px 9px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg-card); color: var(--text); font-weight: 800; font-size: 0.8em; line-height: 1.2; cursor: pointer; }
    .dest button span { display: block; font-size: 1.5em; margin-bottom: 2px; }
    .dest button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; padding: 5px 6px !important; text-align: left; }
    .dest button span { margin: 0 !important; font-size: 1.35em !important; flex: none; }
    .dest button i { font-style: normal; line-height: 1.15; }
    .dest button small { display: block; font-weight: 600; font-size: 0.82em; color: var(--text-2); }
    .dest button.on { border-color: var(--primary); background: rgba(79,172,254,0.15); }
    .dest button.on small { color: var(--primary); }

    /* Barra de formato */
    .tools { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 0; background: var(--bg); }
    .tb { min-width: 38px; height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 0.95em; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .tb:active { transform: scale(0.95); background: var(--bg-input); }
    .tb.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .grp { display: inline-flex; gap: 4px; }
    .sep { width: 1px; height: 28px; background: var(--border); margin: 0 2px; }
    .tam { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
    .tools .tb { min-width: 32px; padding: 0 4px; }
    .tb.inv { background: #000; color: #fff; border-color: #fff; }
    .tam .val { min-width: 30px; text-align: center; font-size: 0.66em; font-weight: 800; color: var(--text-2); line-height: 1.1; }
    .tam .val b { display: block; font-size: 1.4em; color: var(--text); }
    .autoBtn { height: 40px; min-width: 50px; padding: 0 5px; border-radius: 10px; border: 2px solid var(--success); background: transparent; color: var(--success); font-weight: 900; font-size: 0.8em; line-height: 1.05; cursor: pointer; }
    .autoBtn small { display: block; font-size: 0.75em; font-weight: 700; color: var(--text-2); }
    .autoBtn.on { background: var(--success); color: #05301f; }
    /* Opciones de la etiqueta grande */
    .gopts { display: flex; gap: 6px; align-items: center; margin: -2px 0 8px; }
    .gchip { height: 34px; padding: 0 10px; border-radius: 17px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-weight: 800; font-size: 0.76em; white-space: nowrap; cursor: pointer; }
    .seg { flex: 1; display: flex; min-width: 0; border: 1px solid var(--border); border-radius: 17px; overflow: hidden; background: var(--bg-card); }
    .stubTam { flex: none; display: flex; align-items: center; height: 34px; border: 1px solid var(--border); border-radius: 17px; background: var(--bg-card); overflow: hidden; }
    .stubTam button { width: 30px; height: 100%; border: none; background: transparent; color: var(--text); font-size: 1.05em; font-weight: 900; cursor: pointer; }
    .stubTam span { min-width: 30px; text-align: center; font-size: 0.72em; line-height: 1; }
    .stubTam small { display: block; font-size: 0.85em; font-weight: 800; color: var(--text-2); }
    .seg button { flex: 1; min-width: 0; height: 32px; border: none; background: transparent; color: var(--text-2); font-weight: 800; font-size: 0.74em; white-space: nowrap; cursor: pointer; }
    .seg button.on { background: var(--primary); color: #fff; }
    .hint { font-size: 0.72em; color: var(--text-2); margin: 0 0 8px; line-height: 1.35; }

    /* Papel (= lo que sale impreso) */
    .paper-wrap { display: flex; justify-content: center; padding: 6px 0 4px; overflow: hidden; }
    .paper-box { background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,0.45); position: relative; }
    .paper-box.label { outline: 2px dashed rgba(79,172,254,0.55); outline-offset: 3px; }
    .aviso { text-align: center; font-size: 0.78em; font-weight: 700; color: var(--danger); min-height: 1.2em; margin-top: 8px; }

    /* Barra de abajo */
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg-card); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
    .bottom .in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .copias { display: inline-flex; align-items: center; gap: 4px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
    .copias button { width: 36px; height: 36px; border-radius: 9px; border: none; background: var(--bg-card); color: var(--text); font-size: 1.1em; font-weight: 900; cursor: pointer; }
    .copias span { min-width: 52px; text-align: center; font-size: 0.72em; color: var(--text-2); line-height: 1.1; }
    .copias span b { display: block; font-size: 1.35em; color: var(--text); }
    .print { flex: 1; height: 50px; border-radius: 14px; border: none; background: var(--success); color: #05301f; font-size: 1.1em; font-weight: 900; cursor: pointer; }
    .print:disabled { opacity: 0.6; }
    .print:active { transform: scale(0.98); }
    .sec { flex: 1; height: 38px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-weight: 700; font-size: 0.85em; cursor: pointer; }

    /* Toast */
    .toast { position: fixed; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all 0.25s; z-index: 60; max-width: calc(100% - 32px); background: #0b1324; border: 1px solid var(--border); color: var(--text); padding: 11px 16px; border-radius: 12px; font-size: 0.88em; font-weight: 700; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5); pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: var(--success); }
    .toast.err { border-color: var(--danger); }

    /* Hoja de últimos / avisos */
    .sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; }
    .sheet-bg.show { display: flex; }
    .sheet { width: 100%; max-width: 520px; max-height: 80dvh; overflow-y: auto; background: var(--bg-card); border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
    .sheet h2 { margin: 2px 0 10px; font-size: 1em; display: flex; align-items: center; }
    .sheet h2 span { flex: 1; }
    .sheet h2 button { background: none; border: none; color: var(--text-2); font-size: 1.3em; cursor: pointer; }
    .ult { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; background: var(--bg-input); cursor: pointer; }
    .ult .ico { font-size: 1.4em; }
    .ult .mini { flex: none; width: 116px; height: 96px; border-radius: 8px; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .ult .mini > div { flex: none; }
    .ult .tx { flex: 1; min-width: 0; }
    .ult .tx b { display: block; font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ult .tx small { color: var(--text-2); font-size: 0.75em; }
    .ult .x { background: none; border: none; color: var(--text-2); font-size: 1em; padding: 6px 8px; cursor: pointer; }
    .vacio { text-align: center; color: var(--text-2); font-size: 0.85em; padding: 20px 0; }
    .sheet .acciones { display: flex; gap: 8px; margin-top: 12px; }
    .sheet .acciones button { flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-weight: 800; cursor: pointer; }
    .sheet .acciones .pri { background: var(--primary); border-color: var(--primary); color: #fff; }
    /* Confirmar propio (en vez del cartel feo del navegador) */
    .sheet.conf { text-align: center; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    .conf .ic { font-size: 3em; line-height: 1.1; }
    .conf .tx { font-size: 1.1em; font-weight: 800; margin: 8px 0 4px; }
    .conf .sub { font-size: 0.85em; color: var(--text-2); min-height: 0; }
    .conf .bts { display: flex; gap: 10px; margin-top: 16px; }
    .conf .bts button { flex: 1; height: 58px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-size: 1.15em; font-weight: 900; cursor: pointer; }
    .conf .bts .si { background: var(--danger); border-color: var(--danger); color: #fff; }
    .conf .bts .si.ok { background: var(--success); border-color: var(--success); color: #05301f; }

    .topfix .gopts { margin: 0; }
    .topfix .tools { position: static; display: flex; flex-wrap: nowrap; align-items: stretch; gap: 3px; padding: 0; background: none; }
    .topfix .tools .tb { flex: 1 1 0; min-width: 0; height: 42px; padding: 0; }
    .topfix .tools .val { flex: 0 0 28px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .topfix .tools .val { text-align: center; font-size: 0.66em; font-weight: 800; color: var(--text-2); line-height: 1.1; }
    .topfix .tools .val b { display: block; font-size: 1.4em; color: var(--text); }
    #undoBtn { font-size: 1.2em; }
    #undoBtn.vacio { opacity: 0.35; }
    .topfix .tools .autoBtn { flex: 1.35 1 0; min-width: 0; height: 42px; padding: 0 2px; }
    .tsep { flex: 0 0 2px; }
    .ico { flex: none; width: 46px; height: 50px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-size: 1.25em; cursor: pointer; }
    .bottom .copias span { min-width: 44px; }
    .bottom .copias button { width: 32px; }
    .topfix { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 16px 8px; padding-top: env(safe-area-inset-top); }
    .topfix .in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; }
    .topfix .top { padding: 7px 0 0; background: none; border: none; }
    .topfix .top h1 { font-size: 0.95em; }
    .bottom .dest { margin: 0; gap: 5px; }
    .bottom .dest button { min-height: 38px; padding: 3px 4px !important; gap: 5px; border-width: 1.5px; border-radius: 10px; font-size: 0.74em; }
    .bottom .dest button span { font-size: 1.15em !important; }
    .bottom .dest button small { font-size: 0.85em; }
    .wrap { padding-top: 10px; }
    #paper.ticket .ed { min-height: 110px; }   /* solo en pantalla: lugar para escribir */
    #paper.grande.h.conT .stub { border-right: 2px dashed #4facfe; }   /* solo en pantalla: dónde está el troquel */
    #paper.grande.v.conT .stub { border-bottom: 2px dashed #4facfe; }
    #medidor { position: absolute; left: -9999px; top: 0; visibility: hidden; }
</style>
<!-- El mismo CSS va adentro del ticket que se imprime: así sale igual que en la pantalla -->
<style id="cssPapel">
    .paper { width: 265px; box-sizing: border-box; background: #fff; color: #000; }
    .paper.ticket { padding: 4px 4px 6px; }
    .paper.label { height: 207px; padding: 8px; display: flex; align-items: center; overflow: hidden; }
    .ed { width: 100%; font-family: Arial, Helvetica, sans-serif; font-weight: 400; line-height: 1.15; color: #000; outline: none; white-space: pre-wrap; text-align: center; }
    .paper.ticket .ed { overflow-wrap: anywhere; }
    .paper.label .ed, .paper.grande .ed { overflow-wrap: normal; }   /* en etiquetas nunca se corta una palabra */
    .ed b, .ed strong { font-weight: 700; }
    .ed .inv { background: #000; color: #fff; }                 /* letras blancas sobre negro */
    .ed div.inv { padding: 0.06em 0.15em; }
    .ed span.inv { padding: 0 0.12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .ed div, .ed p { margin: 0; }
    /* Etiqueta grande 10x19 con troquel: --s = ancho del pedazo precortado */
    .mainBox { display: contents; }
    .stub { display: none; }
    .paper.grande { position: relative; overflow: hidden; padding: 0; }
    .paper.grande.h { width: 504px; height: 265px; }
    .paper.grande.v { width: 265px; height: 504px; }
    .paper.grande .mainBox { display: flex; align-items: center; position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 8px; box-sizing: border-box; overflow: hidden; }
    .paper.grande.h.conT .mainBox { left: var(--s); }
    .paper.grande.h .mainBox { padding-right: 20px; }   /* la etiqueta termina ~4 mm antes que la hoja */
    .paper.grande.v .mainBox { padding-bottom: 20px; }
    .paper.grande.v.conT .mainBox { top: var(--s); }
    .paper.grande.conT .stub { display: block; position: absolute; left: 0; top: 0; overflow: hidden; box-sizing: border-box; }
    .paper.grande.h.conT .stub { width: var(--s); height: 265px; }
    .paper.grande.v.conT .stub { width: 265px; height: var(--s); }
    .stubIn { display: flex; align-items: center; box-sizing: border-box; padding: 6px 6px 14px;   /* más lugar del lado del corte */ position: absolute; left: 0; top: 0; width: 265px; height: var(--s); overflow: hidden; }
    .paper.grande.h .stubIn { top: 265px; transform-origin: 0 0; transform: rotate(-90deg); }   /* se lee de abajo para arriba */
</style>
</head>
<body>

<div class="topfix" id="topfix">
    <div class="in">
    <div class="top">
        <h1>🖨️ Imprimir</h1>
        <div class="estado" id="estado">⏳ Viendo la PC…</div>
    </div>
        <div class="gopts" id="grOpts" style="display:none">
            <button class="gchip" id="orBtn" onclick="cambiarOrient()">↔ Acostada</button>
            <div class="seg" id="segT">
                <button data-t="rep" onclick="setTroquel('rep')">Repetir</button>
                <button data-t="vac" onclick="setTroquel('vac')">Vacío</button>
                <button data-t="todo" onclick="setTroquel('todo')">Todo</button>
            </div>
            <div class="stubTam" id="stubTam">
                <button onclick="cambiarStub(-1)">−</button>
                <span id="stubPct">✂️<small>100%</small></span>
                <button onclick="cambiarStub(1)">+</button>
            </div>
        </div>
        <div class="tools" id="tools">
            <button class="tb" id="undoBtn" onpointerdown="event.preventDefault()" onclick="deshacer()" title="Deshacer el último cambio">↶</button>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="fmtBold()" title="Negrita"><b>B</b></button>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="fmtTam(-1)" title="Más chico">A−</button>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="fmtTam(1)" title="Más grande" style="font-size:1.1em">A+</button>
            <button class="tb" id="alignBtn" onpointerdown="event.preventDefault()" onclick="fmtAlignCiclo()" title="Alinear la línea (centro → izquierda → derecha)">↔</button>
            <button class="tb inv" onpointerdown="event.preventDefault()" onclick="fmtInv()" title="Letras blancas sobre fondo negro (la línea o la parte marcada)">A</button>
            <span class="tsep"></span>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="cambiarBase(-1)">−</button>
            <div class="val" id="baseVal"><b>16</b>tam.</div>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="cambiarBase(1)">+</button>
            <button class="autoBtn" id="autoBtn" onpointerdown="event.preventDefault()" onclick="toggleAuto()" title="La letra se agranda sola hasta llenar la etiqueta">AUTO</button>
        </div>
    </div>
</div>

<div class="wrap">
    <div class="paper-wrap">
        <div class="paper-box" id="paperBox">
            <div class="paper ticket" id="paper">
                <div class="stub"><div class="stubIn"><div class="ed" id="stubEd"></div></div></div>
                <div class="mainBox"><div class="ed" id="ed" contenteditable="true" spellcheck="false"><div><br></div></div></div>
            </div>
        </div>
    </div>
    <div class="aviso" id="aviso"></div>
</div>

<div id="medidor"></div>
<p id="hint" hidden></p>

<div class="bottom" id="bottom">
    <div class="in">
        <div class="dest" id="dest">
            <button data-d="etiqueta" onclick="setDest('etiqueta')"><span>🏷️</span><i>Etiqueta</i></button>
            <button data-d="grande" onclick="setDest('grande')"><span>📦</span><i>Etiqueta grande</i></button>
            <button data-d="ticket" id="btnTicket" onclick="tocarTicket()" oncontextmenu="event.preventDefault()"><span>🎫</span><i>Ticket<small id="ticketQue">Oficina</small></i></button>
        </div>
        <div class="row">
            <div class="copias">
                <button onclick="cambiarCopias(-1)">−</button>
                <span id="copiasVal"><b>1</b>copia</span>
                <button onclick="cambiarCopias(1)">+</button>
            </div>
            <button class="print" id="printBtn" onclick="imprimir()">🖨️ Imprimir</button>
            <button class="ico" onclick="abrirUltimos()" title="Últimos impresos">🕘</button>
            <button class="ico" onclick="borrarTodo()" title="Borrar todo">🗑️</button>
        </div>
    </div>
</div>

<div class="sheet-bg" id="ultBg" onclick="if(event.target===this)cerrarUltimos()">
    <div class="sheet">
        <h2><span>🕘 Últimos impresos</span><button onclick="cerrarUltimos()">✕</button></h2>
        <div id="ultList"></div>
    </div>
</div>

<div class="sheet-bg" id="offBg" onclick="if(event.target===this)cerrarOff()">
    <div class="sheet">
        <h2><span id="offTitulo">⚠️ La impresora no responde</span><button onclick="cerrarOff()">✕</button></h2>
        <div class="hint" id="offTxt" style="font-size:0.88em"></div>
        <div class="acciones" id="offAcc"></div>
    </div>
</div>

<div class="sheet-bg" id="confBg" onclick="if(event.target===this)_confFin(false)">
    <div class="sheet conf">
        <div class="ic" id="confIc">🗑️</div>
        <div class="tx" id="confTx"></div>
        <div class="sub" id="confSub"></div>
        <div class="bts"><button onclick="_confFin(false)">No</button><button class="si" id="confSi" onclick="_confFin(true)">Sí</button></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API = 'https://mikra-print.rafaelassir.workers.dev';
    const KEY = 'AG4LFDaR5Yhl8QccEtwltnvH';
    const CSS_W = 265;                       // ancho del papel en la página (= 72 mm del ticket / 55 mm de la etiqueta / 100 mm de la grande)
    const G_LARGO = 504;                     // etiqueta grande: 190 mm de largo (calibrada así: con 200 la Honeywell se pone en rojo)
    const TROQUEL = 88;                      // pedazo precortado de la grande: el corte cae a 33 mm de lo impreso (medido con la regla de prueba 09-11)
    // Acostada: la PC imprime la hoja parada (100 de ancho), así que se gira; el troquel queda al principio de la etiqueta
    const GIRO = 'translateX(265px) rotate(90deg)';
    const LV = { 1: 0.6, 2: 0.78, 3: 1, 4: 1.3, 5: 1.7, 6: 2.2, 7: 2.9 };   // tamaños de A− / A+ (relativos al tamaño base)
    const DEST = {   // impresoras de la PC (target del Worker)
        etiqueta: { ico: '🏷️', nom: 'Etiqueta' },
        grande: { ico: '📦', nom: 'Etiqueta grande' },
        oficina: { ico: '🎫', nom: 'Ticket oficina' },
        deposito: { ico: '🎫', nom: 'Ticket depósito' },
    };
    const $ = id => document.getElementById(id);
    const ed = $('ed');

    const guardado = (() => { try { return JSON.parse(localStorage.getItem('imp_cfg') || '{}'); } catch (e) { return {}; } })();
    const cfg = {
        dest: 'etiqueta',                    // siempre arranca en Etiqueta (la más usada)
        ticket: 'oficina',                   // ticket = oficina; mantener apretado → depósito
        baseTicket: guardado.baseTicket || 16,
        baseLabel: guardado.baseLabel || 28,
        baseGrande: guardado.baseGrande || 60,
        auto: guardado.auto !== false,       // etiquetas: la letra llena sola la etiqueta

        const otras = esEtq ? [] : [target === 'deposito' ? 'oficina' : 'deposito'];
        $('offTxt').textContent = esEtq
            ? 'La etiquetera ' + (target === 'grande' ? 'grande' : 'chica') + ' no contesta (¿apagada o sin red?). Prendela y volvé a imprimir.'
            : 'Esa impresora no contesta (¿apagada o sin papel?). ¿Lo mando a la otra?';
        $('offAcc').innerHTML = otras.map(o => '<button class="pri" onclick="retarget(\'' + id + '\',\'' + o + '\')">Mandar a ' + DEST[o].nom + '</button>').join('') +
            '<button onclick="cancelar(\'' + id + '\')">' + (otras.length ? 'Descartar' : 'Cerrar') + '</button>';
        $('offBg').classList.add('show');
    }
    function cerrarOff() { $('offBg').classList.remove('show'); }
    async function retarget(id, o) {
        cerrarOff();
        try { const r = await api('/job/retarget', { method: 'POST', body: JSON.stringify({ id, target: o }) }); if (r.id) seguir(r.id, o); } catch (e) { toast('⚠️ No se pudo', 'err'); }
    }
    async function cancelar(id) { cerrarOff(); try { await api('/job/cancel', { method: 'POST', body: JSON.stringify({ id }) }); } catch (e) {} }

    // ───── Últimos ─────
    function getUltimos() { try { return JSON.parse(localStorage.getItem('imp_ultimos') || '[]'); } catch (e) { return []; } }
    function guardarUltimo(titulo, target) {
        let l = getUltimos().filter(u => u.html !== ed.innerHTML);
        l.unshift({ titulo, target, html: ed.innerHTML, base: baseActual(), auto: cfg.auto, orient: cfg.orient, troquel: cfg.troquel, prev: vistaPapel(), at: Date.now() });
        try { localStorage.setItem('imp_ultimos', JSON.stringify(l.slice(0, 25))); } catch (e) {}
    }
    function fecha(ts) {
        const d = new Date(ts), hoy = new Date(), ayer = new Date(Date.now() - 864e5);
        const h = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
        return d.toDateString() === hoy.toDateString() ? 'Hoy ' + h : d.toDateString() === ayer.toDateString() ? 'Ayer ' + h : d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' ' + h;
    }
    const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    // Copia de cómo se veía la etiqueta (para la imagen chiquita del historial)
    function vistaPapel() {
        const c = $('paper').cloneNode(true);
        c.removeAttribute('id');
        c.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
        c.querySelectorAll('[contenteditable]').forEach(e => e.removeAttribute('contenteditable'));
        return c.outerHTML;
    }
    function miniatura(u) {
        let h = u.prev, cls;
        if (!h) {   // impresos de antes (sin copia guardada): se arma con el texto
            cls = u.target === 'etiqueta' ? 'label' : u.target === 'grande' ? 'grande ' + (u.orient || 'h') + ((u.troquel || 'rep') !== 'todo' ? ' conT' : '') : 'ticket';
            h = '<div class="paper ' + cls + '" style="--s:' + TROQUEL + 'px"><div class="mainBox"><div class="ed" style="--b:' + u.base + 'px;font-size:' + u.base + 'px">' + u.html + '</div></div></div>';
        }
        const grandeH = / grande h/.test(h.slice(0, 80)), grandeV = / grande v/.test(h.slice(0, 80)), lab = / label/.test(h.slice(0, 80));
        const w = grandeH ? 504 : 265, alto = grandeH ? 265 : grandeV ? 504 : lab ? 207 : 0;
        const z = alto ? Math.min(116 / w, 96 / alto) : 116 / w;
        return '<div class="mini"><div style="zoom:' + z.toFixed(3) + (alto ? '' : ';align-self:flex-start') + '">' + h + '</div></div>';
    }
    function abrirUltimos() {
        const l = getUltimos();
        $('ultList').innerHTML = l.length ? l.map((u, i) =>
            '<div class="ult" onclick="usarUltimo(' + i + ')">' + miniatura(u) +
            '<div class="tx"><b>' + esc(u.titulo || '(sin texto)') + '</b><small>' + (DEST[u.target] || DEST.oficina).ico + ' ' + (DEST[u.target] || DEST.oficina).nom + '<br>' + fecha(u.at) + '</small></div>' +
            '<button class="x" onclick="event.stopPropagation();borrarUltimo(' + i + ')">✕</button></div>').join('')
            : '<div class="vacio">Todavía no imprimiste nada desde acá.</div>';
        $('ultBg').classList.add('show');
    }
    function cerrarUltimos() { $('ultBg').classList.remove('show'); }
    function usarUltimo(i) {
        const u = getUltimos()[i]; if (!u) return;
        snap(); ed.innerHTML = u.html;
        if (u.target === 'grande') { if (u.orient) cfg.orient = u.orient; if (u.troquel) cfg.troquel = u.troquel; }
        if (u.target === 'oficina' || u.target === 'deposito') { cfg.ticket = u.target; setDest('ticket'); }
        else setDest(DEST[u.target] ? u.target : 'etiqueta');
        if (esLabel()) { cfg.auto = u.auto !== false; if (!cfg.auto && u.base) ponerBase(u.base); }
        else cfg.baseTicket = u.base || cfg.baseTicket;
        guardarCfg(); guardarBorrador(); refrescar(); cerrarUltimos();
        toast('Listo para imprimir de nuevo (podés editarlo)', '');
    }
    function borrarUltimo(i) { const l = getUltimos(); l.splice(i, 1); try { localStorage.setItem('imp_ultimos', JSON.stringify(l)); } catch (e) {} abrirUltimos(); }

    // ───── Estado de la PC ─────
    function verEstado() {
        api('/status').then(d => {
            $('estado').innerHTML = d.agentOnline ? '🟢 <b>PC conectada</b>' : '🔴 <b>PC desconectada</b> · se imprime al conectarse';
        }).catch(() => { $('estado').textContent = '⚠️ Sin conexión'; });
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) verEstado(); });

    // ───── Toast ─────
    let _tt = 0;
    function toast(msg, tipo) {
        const t = $('toast');
        t.textContent = msg; t.className = 'toast show ' + (tipo || '');
        clearTimeout(_tt); _tt = setTimeout(() => { t.className = 'toast'; }, 3200);
    }

    // ───── Inicio ─────
    try { const b = localStorage.getItem('imp_borrador'); if (b) ed.innerHTML = b; } catch (e) {}
    setDest(cfg.dest);
    verUndo();
    (() => {
        const b = $('bottom'), t = $('topfix');
        const fit = () => {
            const h = b.offsetHeight;
            document.body.style.paddingBottom = (h + 14) + 'px';
            document.body.style.paddingTop = t.offsetHeight + 'px';
            $('toast').style.bottom = (h + 12) + 'px';
        };
        try { const ro = new ResizeObserver(fit); ro.observe(b); ro.observe(t); } catch (e) {}
        fit();
    })();
    verEstado();
</script>
</body>
