<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Imprimir">
<title>Mikra Imprimir</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
<style>
    :root {
        --bg: #0f1a30; --bg-card: #1a2744; --bg-input: #243354; --border: #34466e;
        --text: #eef2fb; --text-2: #9fb0d0; --primary: #4facfe; --success: #34d399;
        --warning: #fbbf24; --danger: #f87171;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
    button { font-family: inherit; }

    .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
    .top h1 { margin: 0; font-size: 1.05em; color: var(--primary); white-space: nowrap; }
    .estado { flex: 1; min-width: 0; font-size: 0.72em; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
    .estado b { font-weight: 700; }

    .wrap { max-width: 520px; margin: 0 auto; padding: 12px 16px 0; }

    /* Destino */
    .dest { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .dest button { padding: 10px 4px 9px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg-card); color: var(--text); font-weight: 800; font-size: 0.8em; line-height: 1.2; cursor: pointer; }
    .dest button span { display: block; font-size: 1.5em; margin-bottom: 2px; }
    .dest button small { display: block; font-weight: 600; font-size: 0.82em; color: var(--text-2); }
    .dest button.on { border-color: var(--primary); background: rgba(79,172,254,0.15); }
    .dest button.on small { color: var(--primary); }

    /* Barra de formato */
    .tools { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 0; background: var(--bg); }
    .tb { min-width: 38px; height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 0.95em; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .tb:active { transform: scale(0.95); background: var(--bg-input); }
    .tb.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .grp { display: inline-flex; gap: 4px; }
    .sep { width: 1px; height: 28px; background: var(--border); margin: 0 2px; }
    .tam { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
    .tam .val.auto b { color: var(--success); }
    .tam .val { cursor: pointer; min-width: 50px; text-align: center; font-size: 0.78em; font-weight: 800; color: var(--text-2); line-height: 1.1; }
    .tam .val b { display: block; font-size: 1.25em; color: var(--text); }
    .hint { font-size: 0.72em; color: var(--text-2); margin: 0 0 8px; line-height: 1.35; }

    /* Papel (= lo que sale impreso) */
    .paper-wrap { display: flex; justify-content: center; padding: 6px 0 4px; }
    .paper-box { background: #fff; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,0.45); position: relative; }
    .paper-box.label { outline: 2px dashed rgba(79,172,254,0.55); outline-offset: 3px; }
    .aviso { text-align: center; font-size: 0.78em; font-weight: 700; color: var(--danger); min-height: 1.2em; margin-top: 8px; }

    /* Barra de abajo */
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg-card); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
    .bottom .in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .copias { display: inline-flex; align-items: center; gap: 4px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
    .copias button { width: 36px; height: 36px; border-radius: 9px; border: none; background: var(--bg-card); color: var(--text); font-size: 1.1em; font-weight: 900; cursor: pointer; }
    .copias span { min-width: 52px; text-align: center; font-size: 0.72em; color: var(--text-2); line-height: 1.1; }
    .copias span b { display: block; font-size: 1.35em; color: var(--text); }
    .print { flex: 1; height: 50px; border-radius: 14px; border: none; background: var(--success); color: #05301f; font-size: 1.1em; font-weight: 900; cursor: pointer; }
    .print:disabled { opacity: 0.6; }
    .print:active { transform: scale(0.98); }
    .sec { flex: 1; height: 38px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-weight: 700; font-size: 0.85em; cursor: pointer; }

    /* Toast */
    .toast { position: fixed; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: all 0.25s; z-index: 60; max-width: calc(100% - 32px); background: #0b1324; border: 1px solid var(--border); color: var(--text); padding: 11px 16px; border-radius: 12px; font-size: 0.88em; font-weight: 700; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5); pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: var(--success); }
    .toast.err { border-color: var(--danger); }

    /* Hoja de últimos / avisos */
    .sheet-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; }
    .sheet-bg.show { display: flex; }
    .sheet { width: 100%; max-width: 520px; max-height: 80dvh; overflow-y: auto; background: var(--bg-card); border-radius: 18px 18px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
    .sheet h2 { margin: 2px 0 10px; font-size: 1em; display: flex; align-items: center; }
    .sheet h2 span { flex: 1; }
    .sheet h2 button { background: none; border: none; color: var(--text-2); font-size: 1.3em; cursor: pointer; }
    .ult { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 6px; background: var(--bg-input); cursor: pointer; }
    .ult .ico { font-size: 1.4em; }
    .ult .tx { flex: 1; min-width: 0; }
    .ult .tx b { display: block; font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ult .tx small { color: var(--text-2); font-size: 0.75em; }
    .ult .x { background: none; border: none; color: var(--text-2); font-size: 1em; padding: 6px 8px; cursor: pointer; }
    .vacio { text-align: center; color: var(--text-2); font-size: 0.85em; padding: 20px 0; }
    .sheet .acciones { display: flex; gap: 8px; margin-top: 12px; }
    .sheet .acciones button { flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); font-weight: 800; cursor: pointer; }
    .sheet .acciones .pri { background: var(--primary); border-color: var(--primary); color: #fff; }

    #paper.ticket .ed { min-height: 110px; }   /* solo en pantalla: lugar para escribir */
    #medidor { position: absolute; left: -9999px; top: 0; visibility: hidden; }
</style>
<!-- El mismo CSS va adentro del ticket que se imprime: así sale igual que en la pantalla -->
<style id="cssPapel">
    .paper { width: 265px; box-sizing: border-box; background: #fff; color: #000; }
    .paper.ticket { padding: 4px 4px 6px; }
    .paper.label { height: 207px; padding: 8px; display: flex; align-items: center; overflow: hidden; }
    .ed { width: 100%; font-family: Arial, Helvetica, sans-serif; font-weight: 400; line-height: 1.15; color: #000; outline: none; white-space: pre-wrap; text-align: center; }
    .paper.ticket .ed { overflow-wrap: anywhere; }
    .ed b, .ed strong { font-weight: 700; }
    .ed div, .ed p { margin: 0; }
</style>
</head>
<body>

<div class="top">
    <h1>🖨️ Imprimir</h1>
    <div class="estado" id="estado">⏳ Viendo la PC…</div>
</div>

<div class="wrap">
    <div class="dest" id="dest">
        <button data-d="deposito" onclick="setDest('deposito')"><span>🎫</span>Ticket<small>Depósito</small></button>
        <button data-d="oficina" onclick="setDest('oficina')"><span>🎫</span>Ticket<small>Oficina</small></button>
        <button data-d="etiqueta" onclick="setDest('etiqueta')"><span>🏷️</span>Etiqueta<small>DP 55×43</small></button>
    </div>

    <div class="tools" id="tools">
        <div class="grp">
            <button class="tb" onpointerdown="event.preventDefault()" onclick="fmtBold()" title="Negrita"><b>B</b></button>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="fmtTam(-1)" title="Más chico">A−</button>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="fmtTam(1)" title="Más grande" style="font-size:1.1em">A+</button>
        </div>
        <button class="tb" id="alignBtn" onpointerdown="event.preventDefault()" onclick="fmtAlignCiclo()" title="Alinear la línea (centro → izquierda → derecha)">↔</button>
        <div class="tam">
            <button class="tb" onpointerdown="event.preventDefault()" onclick="cambiarBase(-1)">−</button>
            <div class="val" id="baseVal" onpointerdown="event.preventDefault()" onclick="if(esLabel())toggleAuto()"><b>16</b>tamaño</div>
            <button class="tb" onpointerdown="event.preventDefault()" onclick="cambiarBase(1)">+</button>
        </div>
    </div>
    <p class="hint" id="hint">Elegí una parte del texto (o dejá el cursor en una línea) y tocá <b>B</b> / <b>A+</b> / <b>A−</b>. <span id="hintEtq"></span></p>

    <div class="paper-wrap">
        <div class="paper-box" id="paperBox">
            <div class="paper ticket" id="paper">
                <div class="ed" id="ed" contenteditable="true" spellcheck="false"><div><br></div></div>
            </div>
        </div>
    </div>
    <div class="aviso" id="aviso"></div>
</div>

<div id="medidor"></div>

<div class="bottom">
    <div class="in">
        <div class="row">
            <div class="copias">
                <button onclick="cambiarCopias(-1)">−</button>
                <span id="copiasVal"><b>1</b>copia</span>
                <button onclick="cambiarCopias(1)">+</button>
            </div>
            <button class="print" id="printBtn" onclick="imprimir()">🖨️ Imprimir</button>
        </div>
        <div class="row">
            <button class="sec" onclick="abrirUltimos()">🕘 Últimos</button>
            <button class="sec" onclick="borrarTodo()">🗑️ Borrar</button>
        </div>
    </div>
</div>

<div class="sheet-bg" id="ultBg" onclick="if(event.target===this)cerrarUltimos()">
    <div class="sheet">
        <h2><span>🕘 Últimos impresos</span><button onclick="cerrarUltimos()">✕</button></h2>
        <div id="ultList"></div>
    </div>
</div>

<div class="sheet-bg" id="offBg" onclick="if(event.target===this)cerrarOff()">
    <div class="sheet">
        <h2><span id="offTitulo">⚠️ La impresora no responde</span><button onclick="cerrarOff()">✕</button></h2>
        <div class="hint" id="offTxt" style="font-size:0.88em"></div>
        <div class="acciones" id="offAcc"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API = 'https://mikra-print.rafaelassir.workers.dev';
    const KEY = 'AG4LFDaR5Yhl8QccEtwltnvH';
    const CSS_W = 265;                       // ancho del papel en la página (= 72 mm del ticket / 55 mm de la etiqueta)
    const LV = { 1: 0.6, 2: 0.78, 3: 1, 4: 1.3, 5: 1.7, 6: 2.2, 7: 2.9 };   // tamaños de A− / A+ (relativos al tamaño base)
    const DEST = {
        deposito: { ico: '🎫', nom: 'Ticket depósito' },
        oficina: { ico: '🎫', nom: 'Ticket oficina' },
        etiqueta: { ico: '🏷️', nom: 'Etiqueta DP' },
    };
    const $ = id => document.getElementById(id);
    const ed = $('ed');

    const guardado = (() => { try { return JSON.parse(localStorage.getItem('imp_cfg') || '{}'); } catch (e) { return {}; } })();
    const cfg = {
        dest: DEST[guardado.dest] ? guardado.dest : 'deposito',
        baseTicket: guardado.baseTicket || 16,
        baseLabel: guardado.baseLabel || 28,
        auto: guardado.auto !== false,       // etiqueta: llenar sola
        copias: 1,
    };
    function guardarCfg() { try { localStorage.setItem('imp_cfg', JSON.stringify({ dest: cfg.dest, baseTicket: cfg.baseTicket, baseLabel: cfg.baseLabel, auto: cfg.auto })); } catch (e) {} }
    const esLabel = () => cfg.dest === 'etiqueta';

    // ───── Destino ─────
    function setDest(d) {
        cfg.dest = d; guardarCfg();
        document.querySelectorAll('#dest button').forEach(b => b.classList.toggle('on', b.dataset.d === d));
        $('paper').className = 'paper ' + (esLabel() ? 'label' : 'ticket');
        $('paperBox').classList.toggle('label', esLabel());
        $('hintEtq').innerHTML = esLabel() ? 'Tocá el número del tamaño para <b>Auto</b> (llena la etiqueta).' : '';
        ajustarZoom(); refrescar();
    }

    // El papel se ve más grande en el celular, pero por dentro mide igual que lo impreso
    function ajustarZoom() {
        const disp = Math.min(window.innerWidth - 32, 488);
        const z = Math.max(1, disp / CSS_W);
        $('paperBox').style.zoom = z.toFixed(3);
    }
    window.addEventListener('resize', ajustarZoom);

    // ───── Tamaño base ─────
    function baseActual() { return esLabel() ? cfg.baseLabel : cfg.baseTicket; }
    function cambiarBase(d) {
        if (esLabel()) { cfg.auto = false; cfg.baseLabel = Math.max(6, Math.min(140, cfg.baseLabel + d * (cfg.baseLabel >= 30 ? 3 : 1))); }
        else cfg.baseTicket = Math.max(8, Math.min(60, cfg.baseTicket + d));
        guardarCfg(); refrescar();
    }
    function toggleAuto() { cfg.auto = !cfg.auto; guardarCfg(); refrescar(); }

    // ¿Entra en la etiqueta con este tamaño? (se mide en una copia invisible, sin zoom)
    function entra(base) {
        const m = $('medidor');
        m.innerHTML = '<div class="paper label"><div class="ed" style="--b:' + base + 'px;font-size:' + base + 'px">' + ed.innerHTML + '</div></div>';
        const p = m.firstChild, e = p.firstChild;
        const cs = getComputedStyle(p);
        const altoUtil = p.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        return e.scrollHeight <= altoUtil + 0.5 && e.scrollWidth <= e.clientWidth + 0.5;
    }
    function autoLlenar() {
        let lo = 6, hi = 140;
        if (!entra(lo)) return lo;
        while (hi - lo > 0.5) { const mid = (lo + hi) / 2; if (entra(mid)) lo = mid; else hi = mid; }
        return Math.floor(lo * 2) / 2;
    }

    let _rafRef = 0;
    function refrescar() {
        cancelAnimationFrame(_rafRef);
        _rafRef = requestAnimationFrame(() => {
            if (esLabel() && cfg.auto) cfg.baseLabel = autoLlenar();
            const b = baseActual();
            ed.style.setProperty('--b', b + 'px');
            ed.style.fontSize = b + 'px';
            $('baseVal').innerHTML = '<b>' + (Math.round(b * 2) / 2) + '</b>' + (esLabel() && cfg.auto ? 'auto' : 'tamaño');
            $('baseVal').classList.toggle('auto', esLabel() && cfg.auto);
            $('aviso').textContent = esLabel() && !cfg.auto && !entra(b) ? '⚠️ No entra en la etiqueta: achicá o tocá Auto' : '';
        });
    }

    // ───── Formato ─────
    let _rango = null;   // última selección dentro del papel (los botones no la pierden)
    document.addEventListener('selectionchange', () => {
        const s = getSelection();
        if (s.rangeCount && ed.contains(s.anchorNode)) _rango = s.getRangeAt(0).cloneRange();
    });
    function tomarSeleccion() {
        const s = getSelection();
        if (!(s.rangeCount && ed.contains(s.anchorNode))) {
            if (!_rango) { ed.focus(); return null; }
            s.removeAllRanges(); s.addRange(_rango);
        }
        if (s.isCollapsed) {   // sin selección: toda la línea donde está el cursor
            let n = s.anchorNode;
            while (n && n.parentNode !== ed) n = n.parentNode;
            const r = document.createRange();
            if (n && n !== ed && n.nodeType === 1) r.selectNodeContents(n); else r.selectNodeContents(ed);
            s.removeAllRanges(); s.addRange(r);
        }
        return s;
    }
    function nivelEn(node) {
        for (let n = node; n && n !== ed; n = n.parentNode) if (n.nodeType === 1 && n.dataset && n.dataset.lv) return +n.dataset.lv;
        return 3;
    }
    // Tamaño: sin selección (o varias líneas) → la línea entera; con una parte elegida → solo esa parte.
    // Los tamaños son relativos al base (calc(var(--b) * x)), así nunca se acumulan.
    function ponerNivel(el, lv) {
        if (lv === 3) { delete el.dataset.lv; el.style.fontSize = ''; }
        else { el.dataset.lv = lv; el.style.fontSize = 'calc(var(--b) * ' + LV[lv] + ')'; }
    }
    function sacarNiveles(root) {   // dentro de lo que cambia de tamaño, los tamaños viejos se van
        root.querySelectorAll('span[data-lv]').forEach(x => x.replaceWith(...x.childNodes));
    }
    function bloquesDe(r) { return [...ed.children].filter(b => r.intersectsNode(b)); }
    // Todo el texto va en líneas <div> (si quedó texto suelto, se lo mete en una)
    function asegurarDivs() {
        let suelto = null;
        [...ed.childNodes].forEach(n => {
            const bloque = n.nodeType === 1 && /^(DIV|P)$/.test(n.tagName);
            if (bloque) { suelto = null; return; }
            if (n.nodeType === 3 && !n.textContent.length) return;
            if (!suelto) { suelto = document.createElement('div'); ed.insertBefore(suelto, n); }
            suelto.appendChild(n);
        });
    }
    function fmtTam(d) {
        asegurarDivs();
        const s0 = getSelection();
        const habiaParte = s0.rangeCount && ed.contains(s0.anchorNode) && !s0.isCollapsed;
        const s = tomarSeleccion(); if (!s) return;
        const r = s.getRangeAt(0);
        const bloques = bloquesDe(r);
        const parcial = habiaParte && bloques.length === 1 && r.toString().trim() !== bloques[0].innerText.trim();
        if (!parcial) {
            bloques.forEach(b => { const lv = Math.max(1, Math.min(7, (+b.dataset.lv || 3) + d)); sacarNiveles(b); ponerNivel(b, lv); });
        } else {
            const ini = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
            const lv = Math.max(1, Math.min(7, nivelEn(ini) + d));
            const frag = r.extractContents();
            const tmp = document.createElement('div'); tmp.appendChild(frag); sacarNiveles(tmp);
            const sp = document.createElement('span');
            while (tmp.firstChild) sp.appendChild(tmp.firstChild);
            ponerNivel(sp, lv);
            if (lv === 3 && nivelEn(ini) !== 3) { sp.dataset.lv = 3; sp.style.fontSize = 'var(--b)'; }
            r.insertNode(sp);
            const r2 = document.createRange(); r2.selectNodeContents(sp);
            s.removeAllRanges(); s.addRange(r2);
        }
        refrescar(); guardarBorrador();
    }
    function fmtBold() { if (!tomarSeleccion()) return; document.execCommand('bold'); refrescar(); guardarBorrador(); }
    const ICO_AL = { Left: '⇤', Center: '↔', Right: '⇥' };
    function fmtAlignCiclo() {
        const s = getSelection();
        if (!(s.rangeCount && ed.contains(s.anchorNode)) && _rango) { s.removeAllRanges(); s.addRange(_rango); }
        let n = getSelection().anchorNode;
        while (n && n.parentNode !== ed) n = n.parentNode;
        const actual = getComputedStyle(n && n.nodeType === 1 ? n : ed).textAlign;
        const sig = actual === 'center' ? 'Left' : (actual === 'left' || actual === 'start') ? 'Right' : 'Center';
        fmtAlign(sig);
        $('alignBtn').textContent = ICO_AL[sig];
    }
    function fmtAlign(a) {
        const s = getSelection();
        if (!(s.rangeCount && ed.contains(s.anchorNode)) && _rango) { s.removeAllRanges(); s.addRange(_rango); }
        if (!ed.contains(getSelection().anchorNode)) { ed.focus(); }
        document.execCommand('justify' + a); refrescar();
    }
    document.execCommand('styleWithCSS', false, false);
    ed.addEventListener('input', () => {
        if (!ed.innerHTML.trim() || ed.innerHTML === '<br>') ed.innerHTML = '<div><br></div>';
        refrescar(); guardarBorrador();
    });
    // Pegar = solo texto (sin colores ni letras raras de otras apps)
    ed.addEventListener('paste', e => {
        e.preventDefault();
        const t = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, t);
    });

    // ───── Borrador, copias, borrar ─────
    function guardarBorrador() { try { localStorage.setItem('imp_borrador', ed.innerHTML); } catch (e) {} }
    function cambiarCopias(d) {
        cfg.copias = Math.max(1, Math.min(20, cfg.copias + d));
        $('copiasVal').innerHTML = '<b>' + cfg.copias + '</b>' + (cfg.copias === 1 ? 'copia' : 'copias');
    }
    function borrarTodo() {
        if (textoPlano() && !confirm('¿Borrar todo el texto?')) return;
        ed.innerHTML = '<div><br></div>'; guardarBorrador(); refrescar(); ed.focus();
    }
    function textoPlano() { return ed.innerText.replace(/ /g, ' ').trim(); }

    // ───── Imprimir ─────
    function armarHtml() {
        const b = baseActual();
        const cuerpo = ed.innerHTML;
        return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}' + $('cssPapel').textContent +
            '</style></head><body><div class="paper ' + (esLabel() ? 'label' : 'ticket') + '"><div class="ed" style="--b:' + b + 'px;font-size:' + b + 'px;' +
            (ed.style.textAlign ? 'text-align:' + ed.style.textAlign + ';' : '') + '">' + cuerpo + '</div></div></body></html>';
    }
    const api = (path, opt) => fetch(API + path, Object.assign({ cache: 'no-store' }, opt || {}, { headers: { 'Content-Type': 'application/json', 'X-Key': KEY } })).then(r => r.json());

    let _ultimoJob = null;
    async function imprimir(targetForzado) {
        if (!textoPlano()) { toast('Escribí algo primero', 'err'); ed.focus(); return; }
        if (esLabel() && !cfg.auto && !entra(baseActual()) && !confirm('No entra entero en la etiqueta (se va a cortar). ¿Imprimir igual?')) return;
        const target = targetForzado || cfg.dest;
        const btn = $('printBtn');
        btn.disabled = true; btn.textContent = '⏳ Mandando…';
        try {
            const titulo = textoPlano().split('\n')[0].slice(0, 60);
            const html = armarHtml();
            const r = await api('/job', { method: 'POST', body: JSON.stringify({ html, title: 'Texto: ' + titulo, target, copies: cfg.copias }) });
            if (!r.id) throw new Error(r.error || 'sin respuesta');
            guardarUltimo(titulo, target);
            _ultimoJob = { id: r.id, target };
            if (!r.agentOnline) {
                toast('🔴 La PC está desconectada: se imprime cuando se conecte', 'err');
                return;
            }
            btn.textContent = '🖨️ Imprimiendo…';
            seguir(r.id, target);
        } catch (e) {
            toast('⚠️ No se pudo mandar: ' + (e.message || e), 'err');
        } finally {
            setTimeout(() => { btn.disabled = false; btn.textContent = '🖨️ Imprimir'; }, 600);
        }
    }
    // Mira unos segundos si salió (solo después de imprimir; no queda preguntando)
    async function seguir(id, target) {
        const fin = Date.now() + 45000;
        while (Date.now() < fin) {
            await new Promise(r => setTimeout(r, 1500));
            let j; try { j = await api('/job?id=' + id); } catch (e) { continue; }
            if (j.status === 'done') { toast('✅ Impreso en ' + DEST[target].nom + (cfg.copias > 1 ? ' (' + cfg.copias + ' copias)' : ''), 'ok'); try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} return; }
            if (j.status === 'offline') { mostrarOffline(id, target); return; }
            if (j.status === 'error') { toast('⚠️ Error al imprimir: ' + (j.error || ''), 'err'); return; }
            if (j.status === 'cancelled' || j.status === 'expired') return;
        }
        toast('⏳ Sigue en cola, todavía no salió', '');
    }
    function mostrarOffline(id, target) {
        $('offTitulo').textContent = '⚠️ ' + DEST[target].nom + ' no responde';
        const otras = target === 'etiqueta' ? [] : [target === 'deposito' ? 'oficina' : 'deposito'];
        $('offTxt').textContent = target === 'etiqueta'
            ? 'La etiquetera DP no contesta (¿apagada o sin red?). Prendela y volvé a imprimir.'
            : 'Esa impresora no contesta (¿apagada o sin papel?). ¿Lo mando a la otra?';
        $('offAcc').innerHTML = otras.map(o => '<button class="pri" onclick="retarget(\'' + id + '\',\'' + o + '\')">Mandar a ' + DEST[o].nom + '</button>').join('') +
            '<button onclick="cancelar(\'' + id + '\')">' + (otras.length ? 'Descartar' : 'Cerrar') + '</button>';
        $('offBg').classList.add('show');
    }
    function cerrarOff() { $('offBg').classList.remove('show'); }
    async function retarget(id, o) {
        cerrarOff();
        try { const r = await api('/job/retarget', { method: 'POST', body: JSON.stringify({ id, target: o }) }); if (r.id) seguir(r.id, o); } catch (e) { toast('⚠️ No se pudo', 'err'); }
    }
    async function cancelar(id) { cerrarOff(); try { await api('/job/cancel', { method: 'POST', body: JSON.stringify({ id }) }); } catch (e) {} }

    // ───── Últimos ─────
    function getUltimos() { try { return JSON.parse(localStorage.getItem('imp_ultimos') || '[]'); } catch (e) { return []; } }
    function guardarUltimo(titulo, target) {
        let l = getUltimos().filter(u => u.html !== ed.innerHTML);
        l.unshift({ titulo, target, html: ed.innerHTML, base: baseActual(), auto: cfg.auto, at: Date.now() });
        try { localStorage.setItem('imp_ultimos', JSON.stringify(l.slice(0, 25))); } catch (e) {}
    }
    function fecha(ts) {
        const d = new Date(ts), hoy = new Date(), ayer = new Date(Date.now() - 864e5);
        const h = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
        return d.toDateString() === hoy.toDateString() ? 'Hoy ' + h : d.toDateString() === ayer.toDateString() ? 'Ayer ' + h : d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' ' + h;
    }
    const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    function abrirUltimos() {
        const l = getUltimos();
        $('ultList').innerHTML = l.length ? l.map((u, i) =>
            '<div class="ult" onclick="usarUltimo(' + i + ')"><div class="ico">' + (DEST[u.target] || DEST.oficina).ico + '</div>' +
            '<div class="tx"><b>' + esc(u.titulo || '(sin texto)') + '</b><small>' + fecha(u.at) + ' · ' + (DEST[u.target] || DEST.oficina).nom + '</small></div>' +
            '<button class="x" onclick="event.stopPropagation();borrarUltimo(' + i + ')">✕</button></div>').join('')
            : '<div class="vacio">Todavía no imprimiste nada desde acá.</div>';
        $('ultBg').classList.add('show');
    }
    function cerrarUltimos() { $('ultBg').classList.remove('show'); }
    function usarUltimo(i) {
        const u = getUltimos()[i]; if (!u) return;
        ed.innerHTML = u.html;
        if (DEST[u.target]) setDest(u.target);
        if (u.target === 'etiqueta') { cfg.auto = u.auto !== false; if (!cfg.auto) cfg.baseLabel = u.base; }
        else cfg.baseTicket = u.base || cfg.baseTicket;
        guardarCfg(); guardarBorrador(); refrescar(); cerrarUltimos();
        toast('Listo para imprimir de nuevo (podés editarlo)', '');
    }
    function borrarUltimo(i) { const l = getUltimos(); l.splice(i, 1); try { localStorage.setItem('imp_ultimos', JSON.stringify(l)); } catch (e) {} abrirUltimos(); }

    // ───── Estado de la PC ─────
    function verEstado() {
        api('/status').then(d => {
            $('estado').innerHTML = d.agentOnline ? '🟢 <b>PC conectada</b>' : '🔴 <b>PC desconectada</b> · se imprime al conectarse';
        }).catch(() => { $('estado').textContent = '⚠️ Sin conexión'; });
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) verEstado(); });

    // ───── Toast ─────
    let _tt = 0;
    function toast(msg, tipo) {
        const t = $('toast');
        t.textContent = msg; t.className = 'toast show ' + (tipo || '');
        clearTimeout(_tt); _tt = setTimeout(() => { t.className = 'toast'; }, 3200);
    }

    // ───── Inicio ─────
    try { const b = localStorage.getItem('imp_borrador'); if (b) ed.innerHTML = b; } catch (e) {}
    setDest(cfg.dest);
    verEstado();
</script>
</body>
</html>
